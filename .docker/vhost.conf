<VirtualHost *:80>
    DocumentRoot /srv/app

    <Directory "/srv/app">
        AllowOverride all
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /srv/app

    SSLEngine on
    SSLCertificateFile /srv/app/keys/sp.crt
    SSLCertificateKeyFile /srv/app/keys/sp.key

    <Directory "/srv/app">
        AllowOverride all
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
