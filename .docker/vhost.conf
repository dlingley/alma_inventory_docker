<VirtualHost *:80>
    DocumentRoot /srv/app

    <Directory "/srv/app">
        AllowOverride all
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Local development only — activates when SP cert exists (keys/ is gitignored,
# so these files are absent in NonProd/Prod where Traefik handles TLS).
<IfFile /srv/app/keys/sp.crt>
<VirtualHost *:443>
    DocumentRoot /srv/app

    SSLEngine on
    SSLCertificateFile /srv/app/keys/sp.crt
    SSLCertificateKeyFile /srv/app/keys/sp.key

    <Directory "/srv/app">
        AllowOverride all
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
</IfFile>
